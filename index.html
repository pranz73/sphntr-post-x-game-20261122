<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c2c">
  <title>Firefly After Dark</title>
  <style>
    :root { color-scheme: dark; font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; background:#0b1320; color:#f5f0dc; }
    * { box-sizing:border-box }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:22px; background:radial-gradient(ellipse at 50% 0%,#243651 0%,#111c2c 48%,#0b1320 100%); }
    .shell { width:min(100%,820px) }
    header { display:flex; justify-content:space-between; align-items:end; margin:0 4px 14px; gap:18px }
    .eyebrow { color:#94b8ae; text-transform:uppercase; letter-spacing:.19em; font-size:11px; font-weight:800 }
    h1 { font-size:clamp(26px,5vw,42px); letter-spacing:-.055em; margin:4px 0 0; line-height:1 }
    .tag { color:#c3cdbd; font-size:13px; text-align:right }
    .hud { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; margin-bottom:10px }
    .pill { border:1px solid #526470; background:#19283a; border-radius:13px; padding:9px 13px; min-height:48px; box-shadow:0 4px 15px #0003 }
    .pill:last-child { text-align:right }
    .label { font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:#9eafa9; display:block }
    .value { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums }
    .center { text-align:center; min-width:116px }
    #game { display:block; width:100%; border:2px solid #526470; border-radius:18px; box-shadow:0 20px 60px #0008; touch-action:none; background:#182d39 }
    .bottom { display:flex; justify-content:space-between; gap:14px; margin:12px 4px 0; color:#b5c4bb; font-size:12px; align-items:center }
    .keys { color:#f5f0dc; font-weight:750; letter-spacing:.04em }
    button { border:1px solid #f5d66c; background:#f5d66c; color:#27313a; padding:10px 17px; border-radius:999px; font:inherit; font-size:13px; font-weight:900; cursor:pointer; box-shadow:0 4px 0 #bd9c3d; transition:transform .1s,box-shadow .1s }
    button:hover { transform:translateY(-1px); box-shadow:0 5px 0 #bd9c3d }
    button:active { transform:translateY(3px); box-shadow:0 1px 0 #bd9c3d }
    .overlay { display:none; position:fixed; inset:0; place-items:center; padding:24px; background:#07111dcc; backdrop-filter:blur(7px); z-index:2 }
    .overlay.show { display:grid }
    .card { max-width:420px; text-align:center; padding:34px; background:#1a2a3b; border:1px solid #71827a; border-radius:24px; box-shadow:0 24px 80px #0008 }
    .card .big { font-size:46px }
    .card h2 { margin:8px 0; font-size:30px; letter-spacing:-.04em }
    .card p { color:#bdc9bd; line-height:1.55; margin:0 0 22px }
    .touch { display:none; gap:7px; align-items:center }
    .touch button { width:42px; height:38px; padding:0; border-radius:10px; touch-action:none }
    @media(max-width:600px) { body{padding:12px} header{align-items:start}.tag{max-width:130px}.pill{padding:8px}.bottom{flex-wrap:wrap}.touch{display:grid;grid-template-columns:repeat(3,42px)}.touch .blank{visibility:hidden} }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="eyebrow">A moonlit pocket game</div><h1>Firefly After Dark</h1></div><div class="tag">A tiny garden.<br>A very hungry owl.</div></header>
    <section class="hud" aria-label="Game status">
      <div class="pill"><span class="label">Fireflies</span><span class="value" id="score">✦ 0 / 8</span></div>
      <div class="pill center"><span class="label">Dawn in</span><span class="value" id="time">45</span></div>
      <div class="pill"><span class="label">Safe flights</span><span class="value" id="lives">♥ ♥ ♥</span></div>
    </section>
    <canvas id="game" width="720" height="480" aria-label="Move the moth through the garden and catch eight fireflies"></canvas>
    <div class="bottom"><div><span class="keys">WASD / ARROWS</span> flutter • <span class="keys">SPACE</span> wingbeat • gather 8</div><div class="touch" aria-label="Touch controls"><span class="blank">.</span><button data-key="up">▲</button><span class="blank">.</span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button><span class="blank">.</span><button data-key="dash">✦</button><span class="blank">.</span></div><button id="start">Start flight</button></div>
  </main>
  <div class="overlay show" id="overlay"><div class="card"><div class="big">🦋</div><h2>Catch the glow</h2><p>Gather all eight fireflies before dawn. The owl only gets three chances to catch you. Ready?</p><button id="play">Begin</button></div></div>
  <script type="module">
    import { createGame, startGame, step, WIDTH, HEIGHT } from './game.mjs';
    const canvas=document.querySelector('#game'), ctx=canvas.getContext('2d');
    const overlay=document.querySelector('#overlay'), state=createGame();
    const keys={left:false,right:false,up:false,down:false,dash:false};
    let last=0, elapsed=0;
    function setKey(name,on){if(name in keys)keys[name]=on}
    addEventListener('keydown',e=>{const k=e.key.toLowerCase();const map={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};if(map[k]){e.preventDefault();setKey(map[k],true)}if(k===' '){e.preventDefault();if(state.phase==='ready')begin();else if(!e.repeat)keys.dash=true}});
    addEventListener('keyup',e=>{const k=e.key.toLowerCase();const map={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};if(map[k])setKey(map[k],false);if(k===' ')keys.dash=false});
    document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setKey(key,true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>setKey(key,false))});
    function begin(){if(state.phase!=='ready')return;startGame(state);overlay.classList.remove('show');document.querySelector('#start').textContent='In flight'}
    document.querySelector('#play').onclick=begin;document.querySelector('#start').onclick=()=>{if(state.phase==='ready')begin();else if(state.phase!=='playing')location.reload()};
    function draw(){
      ctx.clearRect(0,0,WIDTH,HEIGHT);
      const bg=ctx.createLinearGradient(0,0,0,HEIGHT);bg.addColorStop(0,'#203b49');bg.addColorStop(1,'#172b35');ctx.fillStyle=bg;ctx.fillRect(0,0,WIDTH,HEIGHT);
      ctx.save();ctx.globalAlpha=.17;for(let i=0;i<14;i++){let x=(i*97+28)%WIDTH,y=(i*67+18)%HEIGHT;ctx.fillStyle=i%2?'#b2cba7':'#79a8a3';ctx.beginPath();ctx.ellipse(x,y,35,12,i*.7,0,Math.PI*2);ctx.fill()}ctx.restore();
      ctx.strokeStyle='#43615a';ctx.lineWidth=2;ctx.setLineDash([5,9]);ctx.beginPath();ctx.ellipse(360,240,248,158,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      for(const f of state.fireflies){if(f.caught)continue;const pulse=1+Math.sin(elapsed*4+f.phase)*.18;ctx.save();ctx.shadowColor='#ffe77c';ctx.shadowBlur=24;ctx.fillStyle='#ffe77c';ctx.beginPath();ctx.arc(f.x,f.y,6*pulse,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#fff6ba';ctx.beginPath();ctx.arc(f.x-2,f.y-2,2,0,Math.PI*2);ctx.fill()}
      const o=state.owl;ctx.save();if(o.stun>0)ctx.globalAlpha=.45+.3*Math.sin(elapsed*28);ctx.translate(o.x,o.y);ctx.fillStyle='#b98a69';ctx.beginPath();ctx.ellipse(0,4,27,31,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e7caa4';ctx.beginPath();ctx.arc(-10,-4,9,0,Math.PI*2);ctx.arc(10,-4,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#293747';ctx.beginPath();ctx.arc(-10,-4,3.5,0,Math.PI*2);ctx.arc(10,-4,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#efbc67';ctx.beginPath();ctx.moveTo(-4,8);ctx.lineTo(4,8);ctx.lineTo(0,14);ctx.fill();ctx.restore();
      const p=state.player;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.vy,p.vx)*.2);ctx.globalAlpha=state.invulnerable>0&&Math.floor(elapsed*14)%2===0?.35:1;ctx.fillStyle='#c6d6cf';ctx.beginPath();ctx.ellipse(-8,-7,12,7,-.6,0,Math.PI*2);ctx.ellipse(-8,7,12,7,.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5d66c';ctx.beginPath();ctx.ellipse(2,0,9,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263742';ctx.beginPath();ctx.arc(6,-1,1.3,0,Math.PI*2);ctx.fill();ctx.restore();
      ctx.fillStyle='#ffffff10';ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.strokeStyle='#7a958b';ctx.lineWidth=2;ctx.strokeRect(1,1,WIDTH-2,HEIGHT-2);
    }
    function frame(now){const dt=Math.min((now-last)/1000||0,0.04);last=now;elapsed+=dt;if(state.phase==='playing')step(state,keys,dt);keys.dash=false;draw();document.querySelector('#score').textContent=`✦ ${state.caught} / 8`;document.querySelector('#time').textContent=Math.ceil(state.time);document.querySelector('#lives').textContent='♥ '.repeat(state.lives).trim()||'—';if(state.phase==='won'||state.phase==='lost'){overlay.classList.add('show');overlay.querySelector('.big').textContent=state.phase==='won'?'✨':'🌅';overlay.querySelector('h2').textContent=state.phase==='won'?'Garden aglow!':'Morning came';overlay.querySelector('p').textContent=state.phase==='won'?'Every firefly is home. The garden is yours tonight.':'The owl got you or the sun came up. Give it another flight?';document.querySelector('#play').textContent='Fly again';document.querySelector('#play').onclick=()=>location.reload();document.querySelector('#start').textContent='Restart'}requestAnimationFrame(frame)}requestAnimationFrame(frame);
  </script>
</body>
</html>
